name: Bug
description: Report a reproducible failure without secrets or customer data
body:
  - type: textarea
    id: steps
    attributes:
      label: Reproduction, expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Version, commit, platform and sanitized correlation ID
  - type: textarea
    id: integrity
    attributes:
      label: Was local/server data saved, and were ledgers or sync affected?
