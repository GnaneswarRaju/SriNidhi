name: Database CI
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  migrations-and-rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset --local
      - run: supabase db lint --local --level warning --fail-on warning
      - run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/foundation.sql
      - name: Verify real Auth and branch access
        shell: bash
        run: |
          status_file="$RUNNER_TEMP/srinidhi-supabase-status.json"
          trap 'rm -f "$status_file"' EXIT
          supabase status --output json > "$status_file"
          node scripts/verify-live-auth.mjs "$status_file"
      - if: always()
        run: supabase stop --no-backup
